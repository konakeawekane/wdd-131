<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                            
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cookie Monster Character Card">
    <meta property="og:description" content="Interactive Character Card for Cookie Monster">
    <meta property="og:url" content="https://yourURLofPage.here">
    <meta property="og:image" content="https://yourURLofSocialPreviewImageHere.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cookie Monster Character Card">
    <meta name="twitter:description" content="Interactive Character Card for Cookie Monster">
    <meta name="twitter:image" content="https://yourURLofSocialPreviewImageHere.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.png">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/cookieMonster-apple.png">

    <title>Character Card</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <img id="profile" src="images/cookieMonster-og.png" alt="cookie monster">
        <h1 id="name">
            Cookie Monster
        </h1>
        <div id="attriblutes-container">
            <strong>Class: </strong><p class="stat" id="class">hello</p><br>
            <strong>Level: </strong><p class="stat" id="level">hello</p><br>
            <strong>Health: </strong><p class="stat" id="health">hello</p>
        </div>
        <div id="button-container">
            <button id="attack">Attack</button>
            <button id="levelup">Level Up</button>
        </div>
    </main>
    <p class="attribution">"<a rel="noopener noreferrer" href="https://www.flickr.com/photos/50787651@N04/10174117234">Cookie Monster Avatar</a>" by <a rel="noopener noreferrer" href="https://www.flickr.com/photos/50787651@N04">@NonprofitOrgs</a> is licensed under <a rel="noopener noreferrer" href="https://creativecommons.org/licenses/by/2.0/?ref=openverse">CC BY 2.0</p>
</body>
</html>
