<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditCardForm</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png">
    <script src="form.js" defer></script>
</head>
<body>
    <form action="" method="post">
        <div id="front">
            <p>Total:$199</p><p class="icon">💳</p>
            <div class="left">
                <label for="card-number">Card Number</label>
                <input id="card-nummber" name="card-number" type="number" required aria-required="true" pattern="[0-9]{16}" placeholder="Enter 16 digits">
            </div>
            <div class="left">
                <label for="card-holder">Card Holder</label>
                <input id="card-holder" name="card-holder" type="text" required aria-required="true" placeholder="Enter full name of card holder">
            </div>
            <div id="experation">
                <label for="experation-date">Experation</label>
                <input type="text" id="month" name="experation-month" placeholder="MM" aria-labelledby="experation" required aria-required="true">
                <input type="text" id="year" name="experation-year" placeholder="YY" aria-labelledby="experation" required aria-required="true">
            </div>
        </div>
        <div id="back">
            <div id="bar"></div>
            <div id="security-div">
                <label for="security-number">CVC/CVV</label>
                <input type="number" name="security-number" id="security" required aria-required="true" placeholder="xxx" pattern="[0-9]{3}">
            </div>
        </div>
        <button id="submit">Submit</button>
    </form>
    <p class="msg"></p>
</body>
</html>
